name: G13 graphene equilibrium fourth-channel search

on:
  push:
    paths:
      - ".github/workflows/g13-eq-high-fourth-channel-search.yml"
      - "protocols/G13_EQ_HIGH_FOURTH_CHANNEL_SEARCH.json"
      - "scripts/run_g13_eq_high_fourth_channel_search.py"
      - "tests/test_g13_eq_high_fourth_channel_search.py"
      - "results/G13_EQ_HIGH_FOURTH_CHANNEL_CERTIFICATE.json"
      - "graphene/G13_EQ_HIGH_FOURTH_CHANNEL_SEARCH.md"
      - "pyproject.toml"
  pull_request:
    paths:
      - ".github/workflows/g13-eq-high-fourth-channel-search.yml"
      - "protocols/G13_EQ_HIGH_FOURTH_CHANNEL_SEARCH.json"
      - "scripts/run_g13_eq_high_fourth_channel_search.py"
      - "tests/test_g13_eq_high_fourth_channel_search.py"
      - "results/G13_EQ_HIGH_FOURTH_CHANNEL_CERTIFICATE.json"
      - "graphene/G13_EQ_HIGH_FOURTH_CHANNEL_SEARCH.md"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-search:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Test G13 qualification gates
        run: python -m pytest tests/test_g13_eq_high_fourth_channel_search.py
      - name: Reproduce G13 certificate
        run: |
          cp results/G13_EQ_HIGH_FOURTH_CHANNEL_CERTIFICATE.json /tmp/G13.expected.json
          python scripts/run_g13_eq_high_fourth_channel_search.py
          diff -u /tmp/G13.expected.json results/G13_EQ_HIGH_FOURTH_CHANNEL_CERTIFICATE.json
      - name: Upload G13 certificate
        uses: actions/upload-artifact@v4
        with:
          name: g13-eq-high-fourth-channel-python-${{ matrix.python-version }}
          path: results/G13_EQ_HIGH_FOURTH_CHANNEL_CERTIFICATE.json
          if-no-files-found: error
