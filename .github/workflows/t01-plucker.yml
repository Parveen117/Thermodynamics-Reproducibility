name: T01 Pluecker falsification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Unit tests
        run: python -m pytest
      - name: Reproduce synthetic certificate
        run: |
          python scripts/run_t01_synthetic_audit.py
          git diff --exit-code results/T01_SYNTHETIC_AUDIT.json
      - name: Reproduce IAPWS-95 water control
        run: |
          cp results/T01C_IAPWS95_CONTROL.json /tmp/T01C_IAPWS95_CONTROL.expected.json
          python scripts/run_t01_iapws95_control.py
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          expected = json.loads(Path('/tmp/T01C_IAPWS95_CONTROL.expected.json').read_text())
          actual = json.loads(Path('results/T01C_IAPWS95_CONTROL.json').read_text())

          def compare(left, right, path='root'):
              if isinstance(left, dict) and isinstance(right, dict):
                  if left.keys() != right.keys():
                      raise SystemExit(f'IAPWS certificate keys changed at {path}')
                  for key in left:
                      compare(left[key], right[key], f'{path}.{key}')
                  return
              if isinstance(left, list) and isinstance(right, list):
                  if len(left) != len(right):
                      raise SystemExit(f'IAPWS certificate list length changed at {path}')
                  for index, (a, b) in enumerate(zip(left, right, strict=True)):
                      compare(a, b, f'{path}[{index}]')
                  return
              if isinstance(left, (int, float)) and not isinstance(left, bool):
                  if not isinstance(right, (int, float)) or isinstance(right, bool):
                      raise SystemExit(f'IAPWS certificate type changed at {path}')
                  if not math.isclose(float(left), float(right), rel_tol=1e-9, abs_tol=1e-15):
                      raise SystemExit(
                          f'IAPWS certificate numeric value changed at {path}: '
                          f'{left!r} != {right!r}'
                      )
                  return
              if left != right:
                  raise SystemExit(f'IAPWS certificate value changed at {path}: {left!r} != {right!r}')

          compare(expected, actual)
          PY
      - name: Upload IAPWS-95 certificate
        uses: actions/upload-artifact@v4
        with:
          name: t01c-iapws95-python-${{ matrix.python-version }}
          path: results/T01C_IAPWS95_CONTROL.json
