name: G11 graphene diffusivity coverage

on:
  push:
    paths:
      - ".github/workflows/g11-de-coverage.yml"
      - "protocols/G11_DE_COVERAGE_CONTRACT.json"
      - "scripts/run_g11_de_coverage_audit.py"
      - "tests/test_g11_de_coverage.py"
      - "results/G11_DE_COVERAGE_CERTIFICATE.json"
      - "graphene/G11_DE_ACQUISITION_AND_COVERAGE.md"
  pull_request:
    paths:
      - ".github/workflows/g11-de-coverage.yml"
      - "protocols/G11_DE_COVERAGE_CONTRACT.json"
      - "scripts/run_g11_de_coverage_audit.py"
      - "tests/test_g11_de_coverage.py"
      - "results/G11_DE_COVERAGE_CERTIFICATE.json"
      - "graphene/G11_DE_ACQUISITION_AND_COVERAGE.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-coverage:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Test G11 state-variable gates
        run: python -m pytest tests/test_g11_de_coverage.py
      - name: Reproduce G11 certificate
        run: |
          cp results/G11_DE_COVERAGE_CERTIFICATE.json /tmp/G11.expected.json
          python scripts/run_g11_de_coverage_audit.py
          python - <<'PY'
          import json
          from pathlib import Path

          expected = json.loads(Path('/tmp/G11.expected.json').read_text())
          actual = json.loads(Path('results/G11_DE_COVERAGE_CERTIFICATE.json').read_text())
          expected.pop('verification', None)
          if expected != actual:
              raise SystemExit('G11 certificate changed')
          PY
      - name: Upload G11 certificate
        uses: actions/upload-artifact@v4
        with:
          name: g11-de-coverage-python-${{ matrix.python-version }}
          path: results/G11_DE_COVERAGE_CERTIFICATE.json
          if-no-files-found: error
