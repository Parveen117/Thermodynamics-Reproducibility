name: T01D frozen candidate extraction

on:
  push:
    paths:
      - ".github/workflows/t01d-candidate-extraction.yml"
      - "protocols/T01D_CANDIDATE_MANIFEST.json"
      - "scripts/extract_t01d_candidate_points.py"
      - "scripts/build_t01d_water_inventory.py"
      - "tests/test_t01d_extraction.py"
  pull_request:
    paths:
      - ".github/workflows/t01d-candidate-extraction.yml"
      - "protocols/T01D_CANDIDATE_MANIFEST.json"
      - "scripts/extract_t01d_candidate_points.py"
      - "scripts/build_t01d_water_inventory.py"
      - "tests/test_t01d_extraction.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  THERMOML_URL: https://data.nist.gov/od/ds/mds2-2422/ThermoML.v2020-09-30.tgz
  THERMOML_SHA256: 231161b5e443dc1ae0e5da8429d86a88474cb722016e5b790817bb31c58d7ec2
  THERMOML_ARCHIVE: /tmp/ThermoML.v2020-09-30.tgz

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -e ".[test]"

      - name: Test extraction logic
        run: python -m pytest tests/test_t01d_extraction.py tests/test_thermoml_inventory.py

      - name: Restore pinned ThermoML archive
        id: thermoml-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.THERMOML_ARCHIVE }}
          key: thermoml-v2020-09-30-${{ env.THERMOML_SHA256 }}

      - name: Download pinned NIST archive
        if: steps.thermoml-cache.outputs.cache-hit != 'true'
        run: |
          curl --location --fail --retry 5 --retry-delay 5 \
            --output "${THERMOML_ARCHIVE}" "${THERMOML_URL}"

      - name: Verify NIST archive hash
        run: echo "${THERMOML_SHA256}  ${THERMOML_ARCHIVE}" | sha256sum --check --strict

      - name: Extract JSON records
        run: |
          rm -rf /tmp/thermoml-json
          mkdir -p /tmp/thermoml-json
          tar -xzf "${THERMOML_ARCHIVE}" -C /tmp/thermoml-json \
            --wildcards --no-anchored '*.json'

      - name: Extract frozen source slots
        run: |
          set +e
          python scripts/extract_t01d_candidate_points.py /tmp/thermoml-json
          status=$?
          set -e
          test -s results/T01D_CANDIDATE_RAW.json
          test -s results/T01D_CANDIDATE_TOPOLOGY.json
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            exit "$status"
          fi

      - name: Upload frozen extraction certificates
        uses: actions/upload-artifact@v4
        with:
          name: t01d-frozen-candidate-extraction
          path: |
            results/T01D_CANDIDATE_RAW.json
            results/T01D_CANDIDATE_TOPOLOGY.json
          if-no-files-found: error
