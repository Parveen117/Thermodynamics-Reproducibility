name: G12 graphene temperature-coordinate redesign

on:
  push:
    paths:
      - ".github/workflows/g12-temperature-coordinate-redesign.yml"
      - "protocols/G12_TEMPERATURE_COORDINATE_REDESIGN.json"
      - "scripts/run_g12_temperature_coordinate_redesign.py"
      - "tests/test_g12_temperature_coordinate_redesign.py"
      - "results/G12_TEMPERATURE_COORDINATE_CERTIFICATE.json"
      - "graphene/G12_TEMPERATURE_COORDINATE_REDESIGN.md"
  pull_request:
    paths:
      - ".github/workflows/g12-temperature-coordinate-redesign.yml"
      - "protocols/G12_TEMPERATURE_COORDINATE_REDESIGN.json"
      - "scripts/run_g12_temperature_coordinate_redesign.py"
      - "tests/test_g12_temperature_coordinate_redesign.py"
      - "results/G12_TEMPERATURE_COORDINATE_CERTIFICATE.json"
      - "graphene/G12_TEMPERATURE_COORDINATE_REDESIGN.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-redesign:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Test temperature type system
        run: python -m pytest tests/test_g12_temperature_coordinate_redesign.py
      - name: Reproduce G12 certificate
        run: |
          cp results/G12_TEMPERATURE_COORDINATE_CERTIFICATE.json /tmp/G12.expected.json
          python scripts/run_g12_temperature_coordinate_redesign.py
          diff -u /tmp/G12.expected.json results/G12_TEMPERATURE_COORDINATE_CERTIFICATE.json
      - name: Upload G12 certificate
        uses: actions/upload-artifact@v4
        with:
          name: g12-temperature-coordinate-python-${{ matrix.python-version }}
          path: results/G12_TEMPERATURE_COORDINATE_CERTIFICATE.json
          if-no-files-found: error
