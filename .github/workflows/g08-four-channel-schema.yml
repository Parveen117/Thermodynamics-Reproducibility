name: G08 graphene four-channel schema

on:
  push:
    paths:
      - ".github/workflows/g08-four-channel-schema.yml"
      - "protocols/G08_FOUR_CHANNEL_SCHEMA.json"
      - "scripts/run_g08_four_channel_schema.py"
      - "tests/test_g08_four_channel_schema.py"
      - "results/G05_SOURCE_DATA_CERTIFICATE.json"
  pull_request:
    paths:
      - ".github/workflows/g08-four-channel-schema.yml"
      - "protocols/G08_FOUR_CHANNEL_SCHEMA.json"
      - "scripts/run_g08_four_channel_schema.py"
      - "tests/test_g08_four_channel_schema.py"
      - "results/G05_SOURCE_DATA_CERTIFICATE.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install -e ".[test]"
          python -m pip install "openpyxl==3.1.5"
      - name: Test schema extractors
        run: python -m pytest tests/test_g08_four_channel_schema.py
      - name: Audit four-channel schema and common domain
        run: python scripts/run_g08_four_channel_schema.py
      - name: Confirm raw workbooks were not retained
        run: |
          if find . -type f \( -iname '*.xlsx' -o -iname '*.xls' \) -print -quit | grep -q .; then
            echo 'Raw workbook unexpectedly retained' >&2
            exit 1
          fi
      - name: Upload schema-only certificate
        uses: actions/upload-artifact@v4
        with:
          name: g08-graphene-four-channel-schema
          path: results/G08_FOUR_CHANNEL_SCHEMA_AUDIT.json
          if-no-files-found: error
