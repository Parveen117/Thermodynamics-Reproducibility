name: T01D bootstrap robustness audit

on:
  push:
    paths:
      - ".github/workflows/t01d-bootstrap.yml"
      - "protocols/T01D_CANDIDATE_MANIFEST_V2.json"
      - "protocols/T01D_FIT_CONTRACT.json"
      - "scripts/extract_t01d_candidate_points.py"
      - "scripts/run_t01d_independent_plucker.py"
      - "scripts/run_t01d_parametric_bootstrap.py"
  pull_request:
    paths:
      - ".github/workflows/t01d-bootstrap.yml"
      - "protocols/T01D_CANDIDATE_MANIFEST_V2.json"
      - "protocols/T01D_FIT_CONTRACT.json"
      - "scripts/extract_t01d_candidate_points.py"
      - "scripts/run_t01d_independent_plucker.py"
      - "scripts/run_t01d_parametric_bootstrap.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  THERMOML_URL: https://data.nist.gov/od/ds/mds2-2422/ThermoML.v2020-09-30.tgz
  THERMOML_SHA256: 231161b5e443dc1ae0e5da8429d86a88474cb722016e5b790817bb31c58d7ec2
  THERMOML_ARCHIVE: /tmp/ThermoML.v2020-09-30.tgz

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Restore pinned archive
        id: thermoml-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.THERMOML_ARCHIVE }}
          key: thermoml-v2020-09-30-${{ env.THERMOML_SHA256 }}
      - name: Download pinned archive
        if: steps.thermoml-cache.outputs.cache-hit != 'true'
        run: |
          curl --location --fail --retry 5 --retry-delay 5 \
            --output "${THERMOML_ARCHIVE}" "${THERMOML_URL}"
      - name: Verify and extract
        run: |
          echo "${THERMOML_SHA256}  ${THERMOML_ARCHIVE}" | sha256sum --check --strict
          rm -rf /tmp/thermoml-json
          mkdir -p /tmp/thermoml-json
          tar -xzf "${THERMOML_ARCHIVE}" -C /tmp/thermoml-json \
            --wildcards --no-anchored '*.json'
      - name: Reproduce primary v2 result
        run: |
          python scripts/extract_t01d_candidate_points.py /tmp/thermoml-json \
            --manifest protocols/T01D_CANDIDATE_MANIFEST_V2.json
          python scripts/run_t01d_independent_plucker.py \
            --manifest protocols/T01D_CANDIDATE_MANIFEST_V2.json
      - name: Run deterministic bootstrap
        run: |
          python scripts/run_t01d_parametric_bootstrap.py \
            --samples 200000 --seed 20260806
      - name: Upload robustness certificate
        uses: actions/upload-artifact@v4
        with:
          name: t01d-bootstrap-robustness
          path: |
            results/T01D_INDEPENDENT_PLUCKER_SUMMARY.json
            results/T01D_PARAMETRIC_BOOTSTRAP.json
          if-no-files-found: error
