name: G09 graphene common-domain replacement

on:
  push:
    paths:
      - ".github/workflows/g09-common-domain-replacement.yml"
      - "protocols/G09_COMMON_DOMAIN_REPLACEMENT.json"
      - "scripts/validate_g09_replacement.py"
      - "tests/test_g09_replacement.py"
      - "results/G09_REPLACEMENT_CERTIFICATE.json"
  pull_request:
    paths:
      - ".github/workflows/g09-common-domain-replacement.yml"
      - "protocols/G09_COMMON_DOMAIN_REPLACEMENT.json"
      - "scripts/validate_g09_replacement.py"
      - "tests/test_g09_replacement.py"
      - "results/G09_REPLACEMENT_CERTIFICATE.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Test replacement gates
        run: python -m pytest tests/test_g09_replacement.py
      - name: Reproduce replacement audit
        run: python scripts/validate_g09_replacement.py
      - name: Upload replacement certificate
        uses: actions/upload-artifact@v4
        with:
          name: g09-graphene-common-domain-replacement
          path: results/G09_REPLACEMENT_AUDIT.json
          if-no-files-found: error
