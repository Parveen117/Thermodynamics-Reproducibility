name: G05 Majumdar source-data discovery

on:
  push:
    paths:
      - ".github/workflows/g05-majumdar-source-data.yml"
      - "protocols/G05_MAJUMDAR_SOURCE_DATA.json"
      - "scripts/run_g05_source_data_discovery.py"
      - "tests/test_g05_source_data_discovery.py"
  pull_request:
    paths:
      - ".github/workflows/g05-majumdar-source-data.yml"
      - "protocols/G05_MAJUMDAR_SOURCE_DATA.json"
      - "scripts/run_g05_source_data_discovery.py"
      - "tests/test_g05_source_data_discovery.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install -e ".[test]"
          python -m pip install "openpyxl==3.1.5"
      - name: Test workbook discovery helpers
        run: python -m pytest tests/test_g05_source_data_discovery.py
      - name: Discover official source-data workbooks
        run: python scripts/run_g05_source_data_discovery.py
      - name: Confirm raw workbooks were not retained
        run: |
          if find . -type f \( -iname '*.xlsx' -o -iname '*.xls' \) -print -quit | grep -q .; then
            echo 'Raw source-data workbook unexpectedly retained' >&2
            exit 1
          fi
      - name: Upload metadata-only discovery certificate
        uses: actions/upload-artifact@v4
        with:
          name: g05-majumdar-source-data-discovery
          path: results/G05_SOURCE_DATA_DISCOVERY.json
          if-no-files-found: error
